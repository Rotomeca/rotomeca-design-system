name: Documentation

# Construit le site de documentation (`pnpm docs:build`) et le publie sur GitHub Pages.
# Prérequis (une seule fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La version de pnpm vient du champ `packageManager` de package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Porte de validation : typecheck + lint + build du design system.
      - run: pnpm test

      - uses: actions/configure-pages@v5
        id: pages

      # Le site est servi sous /<nom-du-dépôt>/ (le chemin est fourni par configure-pages).
      - name: Générer le site
        run: pnpm docs:build
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
