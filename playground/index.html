<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rotomeca Design System — Playground</title>
    <link rel="stylesheet" href="/.build/design-system.css" />
    <style>
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1rem;
      }
      .swatch {
        border: 1px solid #0002;
        border-radius: 8px;
        overflow: hidden;
        font: 13px/1.4 sans-serif;
      }
      .swatch .states {
        display: flex;
        height: 64px;
      }
      .swatch .states div {
        flex: 1;
      }
      .swatch p {
        margin: 0;
        padding: 0.5rem;
      }
    </style>
  </head>
  <body class="body">
    <h1>Rotomeca Design System</h1>
    <h2>Tokens (--ds-*)</h2>
    <div class="grid" id="tokens"></div>
    <h2>Boutons</h2>
    <div id="buttons" style="display: grid; gap: 1rem"></div>
    <script type="module">
      import './.build/index.js';
      const variants = ['primary', 'secondary', 'tertiary', 'warning', 'danger', 'success'];
      const row = (title, attrs, content = (v) => v) =>
        `<div><b>${title}</b><br>${variants
          .map((v) => `<rds-button variant="${v}" ${attrs}>${content(v)}</rds-button>`)
          .join(' ')}</div>`;
      document.getElementById('buttons').innerHTML = [
        row('Variations', ''),
        row('Arrondi', 'rounded'),
        row('Désactivé', 'disabled'),
        row('Chargement', 'loading'),
        row('Chargement icône seule', 'loading label="Envoi"', () => ''),
        row('Icône avant', 'icon-before="house"'),
        row('Icône après', 'icon-after="arrow-right"'),
        row('Marge icône 1.5rem', 'icon-before="house" icon-gap="1.5rem"'),
        row('Icône seule', 'icon-before="settings" label="Réglages"', () => ''),
        row('Icône seule arrondie', 'icon-before="x" rounded label="Fermer"', () => ''),
      ].join('');
    </script>
    <script>
      const tokens = [
        'background-action-primary',
        'background-action-secondary',
        'text-action-primary',
        'text-action-secondary',
      ];
      document.getElementById('tokens').innerHTML = tokens
        .map(
          (t) => `
      <div class="swatch">
        <div class="states">
          <div style="background:var(--ds-${t})"></div>
          <div style="background:var(--ds-${t}-hover)"></div>
          <div style="background:var(--ds-${t}-active)"></div>
        </div>
        <p><b>${t}</b><br>défaut · hover · active</p>
      </div>`,
        )
        .join('');
      new EventSource('/esbuild').addEventListener('change', () => location.reload());
    </script>
  </body>
</html>
