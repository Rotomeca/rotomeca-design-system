<!-- example: Regrouper sans boîte -->
<!-- note: `rds-fragment` ne génère aucune boîte : ses enfants se comportent comme s'ils étaient directement dans le parent. -->
<rds-flexbox gap="2" align="center">
  <rds-fragment>
    <rds-tag>Un</rds-tag>
    <rds-tag>Deux</rds-tag>
  </rds-fragment>
  <rds-tag>Trois</rds-tag>
</rds-flexbox>
