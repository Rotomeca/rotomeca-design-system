<!-- example: Un seul panneau ouvert -->
<!-- layout: block -->
<rds-accordion single>
  <rds-accordion-item label="Qu'est-ce qu'un token ?" icon="circle-help" open>Une valeur de design nommée, lue par les composants.</rds-accordion-item>
  <rds-accordion-item label="Pourquoi Shadow DOM ?">Pour isoler les styles de chaque brique.</rds-accordion-item>
  <rds-accordion-item label="Désactivée" disabled>Contenu masqué.</rds-accordion-item>
</rds-accordion>

</rds-accordion>
