<!-- example: Groupe de radios -->
<!-- note: Les radios partageant le même `name` forment un groupe ; entourez-les d'un `role="radiogroup"` nommé. -->
<div role="radiogroup" aria-label="Taille" style="display: flex; gap: 1rem; flex-wrap: wrap">
  <rds-radio name="taille" value="s">Petit</rds-radio>
  <rds-radio name="taille" value="m" checked>Moyen</rds-radio>
  <rds-radio name="taille" value="l">Grand</rds-radio>
  <rds-radio name="taille" value="xl" disabled>Très grand</rds-radio>
</div>
