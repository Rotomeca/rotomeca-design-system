<!-- example: Icônes Lucide -->
<!-- note: `name` est le nom d'un fichier de [lucide.dev](https://lucide.dev/icons) (sans `.svg`). -->
<rds-icon name="leaf"></rds-icon>
<rds-icon name="house"></rds-icon>
<rds-icon name="settings"></rds-icon>
<rds-icon name="trash-2"></rds-icon>
<rds-icon name="sun"></rds-icon>
<rds-icon name="moon"></rds-icon>

<!-- example: Taille et couleur -->
<!-- note: L'icône hérite de `currentColor` : sa couleur suit celle du texte. -->
<span style="color: var(--ds-text-action-tertiary); font-size: 2rem">
  <rds-icon name="leaf"></rds-icon>
</span>
<span style="color: var(--ds-text-danger); font-size: 1.25rem">
  <rds-icon name="triangle-alert"></rds-icon>
</span>
