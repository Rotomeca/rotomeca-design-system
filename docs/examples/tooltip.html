<!-- example: Infobulles -->
<!-- note: Survolez ou donnez le focus à l'élément pour afficher l'infobulle. -->
<!-- height: 8rem -->
<rds-tooltip text="Enregistrer le motif (Ctrl+S)">
  <rds-icon-button icon="download" label="Enregistrer"></rds-icon-button>
</rds-tooltip>
<rds-tooltip text="Copier le lien" placement="bottom">
  <rds-icon-button icon="copy" label="Copier"></rds-icon-button>
</rds-tooltip>
<rds-tooltip text="Infobulle sur un bouton texte">
  <rds-secondary-button>Survolez-moi</rds-secondary-button>
</rds-tooltip>
<rds-tooltip text="Retournée si la place manque">
  <rds-badge tone="accent">Badge</rds-badge>
</rds-tooltip>
