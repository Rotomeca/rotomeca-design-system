<!-- example: Alignement -->
<rds-flexbox justify="space-between" align="center" gap="2" style="width: 100%">
  <span>Nouveau motif</span>
  <rds-primary-button size="sm">Créer</rds-primary-button>
</rds-flexbox>

<!-- example: Retour à la ligne -->
<rds-flexbox gap="1-5" wrap style="max-width: 16rem">
  <rds-tag>Un</rds-tag><rds-tag>Deux</rds-tag><rds-tag>Trois</rds-tag><rds-tag>Quatre</rds-tag>
  <rds-tag>Cinq</rds-tag><rds-tag>Six</rds-tag>
</rds-flexbox>

<!-- example: Colonne inversée -->
<rds-flexbox mode="column" inverted gap="12px">
  <span>Premier (affiché en bas)</span><span>Second (affiché en haut)</span>
</rds-flexbox>
