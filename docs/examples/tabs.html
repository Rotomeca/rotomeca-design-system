<!-- example: Onglets -->
<!-- note: La barre est générée depuis les `rds-tab-panel` enfants. Flèches, Début et Fin naviguent au clavier. -->
<!-- layout: block -->
<rds-tabs>
  <rds-tab-panel label="Couleurs" icon="palette">Palette automnale : marron, cuivre, ocre.</rds-tab-panel>
  <rds-tab-panel label="Typographie" icon="type">Fraunces pour les titres, Figtree pour le texte.</rds-tab-panel>
  <rds-tab-panel label="Désactivé" disabled>Inaccessible.</rds-tab-panel>
  <rds-tab-panel label="Mouvement">Courtes transitions sur transform et opacity.</rds-tab-panel>
</rds-tabs>

<!-- example: Pastilles pleine largeur -->
<!-- layout: block -->
<rds-tabs variant="pills" full>
  <rds-tab-panel label="Jour">Thème clair.</rds-tab-panel>
  <rds-tab-panel label="Nuit" selected>Thème « Sous-bois ».</rds-tab-panel>
</rds-tabs>
