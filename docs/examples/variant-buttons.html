<!-- example: Quatre boutons prêts à l'emploi -->
<!-- note: Variante figée : pas d'attribut `variant`, mêmes autres attributs que `rds-button`. -->
<rds-primary-button icon-before="leaf">Créer un motif</rds-primary-button>
<rds-secondary-button>Annuler</rds-secondary-button>
<rds-tertiary-button>Plus tard</rds-tertiary-button>
<rds-danger-button icon-before="trash-2">Supprimer</rds-danger-button>

<!-- example: Tailles et état -->
<rds-primary-button size="sm">Petit</rds-primary-button>
<rds-secondary-button size="lg">Grand</rds-secondary-button>
<rds-danger-button disabled>Désactivé</rds-danger-button>
<rds-primary-button loading>Envoi</rds-primary-button>
