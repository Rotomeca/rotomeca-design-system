<!-- example: Variantes et tailles -->
<rds-icon-button icon="x" label="Fermer" size="sm"></rds-icon-button>
<rds-icon-button icon="settings" label="Réglages"></rds-icon-button>
<rds-icon-button icon="trash-2" label="Supprimer" variant="danger" size="lg"></rds-icon-button>
<rds-icon-button icon="plus" label="Ajouter" variant="primary" square></rds-icon-button>

<!-- example: Bouton à bascule -->
<!-- note: Avec `toggle`, le bouton garde son état ; `selected-icon` remplace l'icône quand il est actif. -->
<rds-icon-button icon="heart" selected-icon="heart-handshake" label="Favori" toggle></rds-icon-button>
<rds-icon-button icon="bookmark" label="Enregistrer" toggle></rds-icon-button>
